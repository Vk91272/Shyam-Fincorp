<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Shyam Fincorp | Admin Login
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #07111f,
          #10243d
        );

      padding: 20px;

    }


    .login-container {

      width: 100%;

      max-width: 430px;

    }


    .login-card {

      background: #fff;

      border-radius: 24px;

      padding: 38px;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,0.30);

    }


    .logo {

      width: 65px;

      height: 65px;

      border-radius: 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #111827;

      color: white;

      font-size: 22px;

      font-weight: 800;

      margin-bottom: 22px;

    }


    h1 {

      margin: 0 0 8px;

      color: #111827;

    }


    .subtitle {

      margin: 0 0 28px;

      color: #6b7280;

    }


    .form-group {

      margin-bottom: 18px;

    }


    label {

      display: block;

      margin-bottom: 7px;

      font-weight: 600;

      color: #374151;

    }


    input {

      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d1d5db;

      border-radius: 12px;

      outline: none;

      font-size: 15px;

    }


    input:focus {

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37,99,235,0.10);

    }


    button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 14px;

      background: #2563eb;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

    }


    button:hover {

      opacity: 0.92;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .error {

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #fee2e2;

      color: #991b1b;

      display: none;

      font-size: 14px;

    }


    .footer {

      text-align: center;

      margin-top: 20px;

      color: #9ca3af;

      font-size: 12px;

    }


    @media (
      max-width: 500px
    ) {

      .login-card {

        padding: 28px 22px;

      }

    }

  </style>

</head>


<body>


<div class="login-container">

  <div class="login-card">


    <div class="logo">
      SF
    </div>


    <h1>
      Admin Login
    </h1>


    <p class="subtitle">
      Shyam Fincorp CRM Console
    </p>


    <form id="loginForm">


      <div class="form-group">

        <label>
          Username
        </label>

        <input
          type="text"
          id="username"
          autocomplete="username"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          id="password"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        id="loginButton"
      >
        Login to CRM
      </button>


      <div
        class="error"
        id="loginError"
      ></div>


    </form>


    <div class="footer">
      Shyam Fincorp • Secure Admin Console
    </div>


  </div>

</div>


<script>

const API_BASE =
  "https://shyam-fincorp.onrender.com";


const TOKEN_KEY =
  "shyam_admin_token";


const USER_KEY =
  "shyam_admin_user";


/* Existing login check */

const existingToken =
  localStorage.getItem(
    TOKEN_KEY
  );


if (existingToken) {

  window.location.href =
    "crm.html";
}


/* Login */

const form =
  document.getElementById(
    "loginForm"
  );


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const username =
      document.getElementById(
        "username"
      ).value.trim();


    const password =
      document.getElementById(
        "password"
      ).value;


    const button =
      document.getElementById(
        "loginButton"
      );


    const errorBox =
      document.getElementById(
        "loginError"
      );


    errorBox.style.display =
      "none";


    button.disabled =
      true;


    button.textContent =
      "Signing in...";


    try {

      const response =
        await fetch(
          `${API_BASE}/api/admin/login`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                username,
                password
              })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Login failed"
        );
      }


      if (!data.token) {

        throw new Error(
          "Server did not return login token"
        );
      }


      localStorage.setItem(
        TOKEN_KEY,
        data.token
      );


      localStorage.setItem(
        USER_KEY,
        username
      );


      window.location.href =
        "crm.html";


    } catch (error) {

      errorBox.textContent =
        error.message;


      errorBox.style.display =
        "block";


      button.disabled =
        false;


      button.textContent =
        "Login to CRM";
    }

  }
);

</script>


</body>

</html>
